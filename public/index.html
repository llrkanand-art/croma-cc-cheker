<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Croma Coupon Checker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070d18;color:#e5e7eb;font:14px/1.45 system-ui,sans-serif;padding:12px;max-width:760px;margin:0 auto}
.card{background:#0f172a;border:1px solid #26364d;border-radius:12px;padding:16px;margin-bottom:12px}
h1{font-size:20px;color:#f8fafc;margin-bottom:8px}
.sub{color:#94a3b8;font-size:12px}
.sess{display:flex;align-items:center;gap:10px;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px;margin-top:8px}
.dot{width:10px;height:10px;border-radius:50%;background:#fb7185}
.dot.live{background:#34d399;box-shadow:0 0 8px #34d399}
.btn{padding:10px 15px;border:0;border-radius:8px;color:#fff;font-weight:700;cursor:pointer;margin-right:5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.run{background:#3b82f6} .run:hover{background:#2563eb}
.stop{background:#ef4444} .stop:hover{background:#dc2626}
.pause{background:#f59e0b} .pause:hover{background:#d97706}
.resume{background:#10b981} .resume:hover{background:#059669}
textarea{width:100%;min-height:100px;background:#020617;border:1px solid #334155;border-radius:8px;color:#cbd5e1;padding:10px;font:11px monospace;outline:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:#111827;padding:8px;border-radius:8px;text-align:center;border:1px solid #1f2937}
.stat b{font-size:18px;color:#fff}
.stat span{font-size:9px;color:#6b7280;display:block}
table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
th{background:#1f2937;text-align:left;padding:8px;color:#94a3b8}
td{padding:8px;border-bottom:1px solid #1f2937}
.ok{color:#34d399} .na{color:#d97706} .err{color:#f87171}
.status-bar{padding:8px;background:#1f2937;border-radius:8px;margin-bottom:12px;display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.json-input{background:#050c1a;color:#7ee787}
.hidden{display:none}
#configJson { display: none; }
</style>
</head>
<body>

<div class="stats">
  <div class="stat"><span>Checked</span><b id="s-checked">0</b></div>
  <div class="stat"><span>Valid</span><b id="s-valid">0</b></div>
  <div class="stat"><span>NA</span><b id="s-na">0</b></div>
  <div class="stat"><span>Err</span><b id="s-err">0</b></div>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center">
      <h1>Croma Checker</h1>
      <div class="sess">
          <i class="dot" id="dot"></i>
          <span style="font-size:11px;color:#cbd5e1" id="cartName">No Session</span>
      </div>
  </div>
  
  <div class="sess" style="background:#0f172a;margin-top:8px">
      <button class="btn" onclick="loadConfig()">Load Session Config</button>
      <textarea id="configJson" placeholder='Paste JSON here:\n{\n  "cookies": [...], \n  "url": "https://.../cart-modification...", \n  "inCallResponse": "..."\n}'></textarea>
      <div style="margin-top:5px;font-size:10px;color:#94a3b8">Format: Check console or Network tab for 'url' & 'inCallResponse'</div>
      <div id="syncStatus" style="margin-top:5px;font-weight:700;color:#34d399;display:none">✅ Session Saved! Ready to Check.</div>
  </div>
</div>

<div class="card">
    <h1>Coupons</h1>
    <textarea id="codes" placeholder="CODE1&#10;CODE2&#10;SAVE500"></textarea>
    <div style="margin-top:10px;display:flex;gap:5px;align-items:center">
        <button class="btn run" id="runBtn">START</button>
        <button class="btn pause" id="pauseBtn">PAUSE</button>
        <button class="btn stop" id="stopBtn" disabled>STOP</button>
        <div style="margin-left:auto;font-size:11px">
            <input type="checkbox" id="chkPause"> <label for="chkPause">Auto Pause on Error (3+)</label>
        </div>
    </div>
</div>

<div class="status-bar">
    <span id="statusText">Ready</span>
    <span id="progressText">0%</span>
</div>

<div class="card">
    <table>
        <thead><tr><th>#</th><th>Coupon</th><th>Result</th><th>Value</th></tr></thead>
        <tbody id="tbody"></tbody>
    </table>
</div>

<div class="card"><details><summary style="color:#94a3b8;cursor:pointer">Log</summary><pre id="log" style="font-size:10px;color:#6b7280;max-height:100px;overflow:auto;">...</pre></details></div>

<script>
const $=id=>document.getElementById(id);
let jobId=null, jobDone=true, rowCount=0, jobPaused=false;

// Load previous codes
$('codes').value = localStorage.getItem('cc_codes') || '';

// --- SESSION HANDLING ---
function loadConfig() {
    const txt = $('configJson').value;
    if(!txt) { alert('Koi JSON nahi hai'); return; }
    try {
        const config = JSON.parse(txt);
        fetch('/api/session', {
            method: 'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify(config)
        }).then(r=>r.json()).then(res=>{
            if(res.ok) {
                $('syncStatus').style.display='block';
                $('syncStatus').innerHTML = `✅ Saved! | Cart: ${res.cartNames || 'Unknown'}`;
                $('dot').classList.add('live');
                $('cartName').textContent = res.cartNames || 'Session Active';
                alert('Session Save ho gaya!');
            } else {
                alert('Error: ' + res.error);
            }
        });
    } catch(e) { alert('JSON format ghalat hai'); }
}

async function checkSync() {
    try {
        const j = await fetch('/api/session').then(r=>r.json());
        if(j.live) {
            $('dot').classList.add('live');
            $('cartName').textContent = j.cartNames || 'Synced';
        } else {
            $('dot').classList.remove('live');
            $('cartName').textContent = 'No Session';
        }
    } catch {}
}

// --- CHECKER LOGIC ---
$('runBtn').onclick = () => {
    const codes = $('codes').value.trim();
    if(!codes) return alert('Coupons dalo pehle');
    $('tbody').innerHTML=''; rowCount=0;
    $('pauseBtn').style.display='none'; // Hide pause until running
    $('stopBtn').disabled=false; $('runBtn').disabled=true;
    
    fetch('/api/check', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({codes, pauseOnError: $('chkPause').checked})
    }).then(r=>r.json()).then(j=>{
        if(!j.ok) alert(j.error);
        else { jobId=j.jobId; jobDone=false; poll(); }
    });
};

$('stopBtn').onclick = () => fetch('/api/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jobId})});

$('pauseBtn').onclick = () => {
    jobPaused = !jobPaused;
    $('pauseBtn').textContent = jobPaused ? "RESUME" : "PAUSE";
    if(!jobPaused) fetch('/api/resume', {method:'POST', headers:{'Content-Type':'application/json'},body:JSON.stringify({jobId})});
};

function poll() {
    if(!jobId || jobDone) return;
    fetch(`/api/result?jobId=${jobId}&from=${rowCount}`)
    .then(r=>r.json()).then(j=>{
        if(!j.ok) return;
        if(j.results) j.results.forEach(r => {
            const tr=document.createElement('tr');
            const cls = r.error ? 'err' : (r.valid ? 'ok' : 'na');
            tr.innerHTML=`<td>${++rowCount}</td><td>${r.code}</td><td class="${cls}">${r.valid?'VALID':(r.error?'ERR':'NA')}</td><td>Rs. ${r.discount||0}</td>`;
            $('tbody').appendChild(tr);
        });
        $('s-checked').textContent = j.counts.checked;
        $('s-valid').textContent = j.counts.valid;
        $('s-na').textContent = j.counts.na;
        $('s-err').textContent = j.counts.errors;
        $('log').innerText = (j.log||[]).join('\n');
        
        const pct = Math.round(j.counts.checked/j.total*100) || 0;
        $('progressText').textContent = pct + '%';
        $('statusText').textContent = j.status.toUpperCase();

        if(j.status === 'paused') {
            $('pauseBtn').style.display='block';
            $('statusText').textContent = "⏸ PAUSED (Errors detected)";
        } else {
             $('pauseBtn').style.display='block';
        }

        if(j.status==='running'||j.status==='stopping'){ setTimeout(poll, 800); }
        else { jobDone=true; $('runBtn').disabled=false; $('stopBtn').disabled=true; 
              $('statusText').textContent = `🏁 ${j.status.toUpperCase()}`;
        }
    });
}

// Keep Alive
setInterval(()=>fetch('/api/ping').catch(()=>{}), 20000);
setInterval(checkSync, 5000);
checkSync();
</script>
</body>
</html>
