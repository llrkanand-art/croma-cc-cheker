<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Croma Coupon Checker</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b1220">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070d18;color:#e5e7eb;font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;padding:12px;max-width:760px;margin:0 auto}
.card{background:#0f172a;border:1px solid #26364d;border-radius:16px;padding:16px;margin-bottom:12px}
h1{font-size:21px;letter-spacing:-.03em;color:#f8fafc}
.sub{color:#94a3b8;font-size:12px;margin-top:3px}
.sess{display:flex;align-items:center;gap:10px;background:#0f1d2e;border:1px solid #1e4057;border-radius:12px;padding:12px;margin-top:12px}
.dot{width:9px;height:9px;border-radius:50%;background:#fb7185;flex-shrink:0}
.dot.live{background:#34d399;box-shadow:0 0 10px #34d399}
.sess-info{flex:1;min-width:0}
.cart-name{color:#dbeafe;font-size:12px;font-weight:700;word-break:break-word}
.badge{font-size:10px;color:#67e8f9;font-weight:800;letter-spacing:.1em}
.btn-sm{padding:8px 10px;background:#1e293b;border:1px solid #334155;color:#e5e7eb;font-size:11px;font-weight:700;border-radius:8px;cursor:pointer}
textarea{width:100%;min-height:130px;resize:vertical;background:#080e18;border:1px solid #334155;border-radius:10px;color:#dbeafe;padding:12px;font:12px/1.55 ui-monospace,monospace;outline:0}
textarea:focus{border-color:#22d3ee}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
button{border:0;border-radius:9px;padding:12px 14px;color:#f8fafc;font-size:12px;font-weight:800;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.run{flex:1;background:linear-gradient(110deg,#0891b2,#6366f1 55%,#a855f7)}
.stop{background:#9f1239}
.load{background:#1e293b;border:1px solid #334155}
.csv{background:#164e63;border:1px solid #155e75;font-size:10px;padding:9px}
.csv.g{background:#065f46;border-color:#047857}
.csv.y{background:#713f12;border-color:#92400e}
small{color:#64748b;font-size:10px}
.pill{display:flex;align-items:center;gap:6px;background:#111c2d;border:1px solid #334155;border-radius:9px;padding:9px 11px;font-size:10px;font-weight:700;color:#cbd5e1}
.pill input[type=number]{width:44px;background:#080e18;border:1px solid #475569;border-radius:5px;color:#fff;text-align:center;font:700 11px monospace}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:#111c2d;border:1px solid #26364d;border-radius:12px;padding:11px}
.stat b{display:block;font-size:21px;color:#f8fafc}
.stat span{font-size:9px;color:#94a3b8;font-weight:700}
.stat.v b{color:#34d399}.stat.n b{color:#fbbf24}.stat.e b{color:#fb7185}
.bar{height:7px;background:#080e18;border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#a855f7);transition:width .3s}
table{width:100%;border-collapse:collapse;font:11px ui-monospace,monospace}
th{position:sticky;top:0;background:#172235;color:#67e8f9;text-align:left;padding:8px;font-size:9px;text-transform:uppercase}
td{padding:8px;border-bottom:1px solid #1e293b;color:#cbd5e1;word-break:break-word}
.ok{color:#34d399;font-weight:900}.na{color:#fbbf24;font-weight:900}.err{color:#fb7185;font-weight:900}
.valid-list{background:#052e2b;border:1px solid #075e4b;border-radius:10px;padding:10px;color:#d1fae5;font:11px/1.6 ui-monospace,monospace;white-space:pre-wrap;max-height:140px;overflow:auto}
.pulse{animation:p 1.6s infinite}@keyframes p{50%{opacity:.4}}
a{color:#67e8f9}
</style>
</head>
<body>

<div class="stats">
  <div class="stat"><span>CHECKED</span><b id="s-checked">0</b></div>
  <div class="stat v"><span>VALID</span><b id="s-valid">0</b></div>
  <div class="stat n"><span>NA</span><b id="s-na">0</b></div>
  <div class="stat e"><span>ERR</span><b id="s-err">0</b></div>
</div>

<div class="card">
  <h1>Coupon Checker</h1>
  <p class="sub">Server pe background check &middot; <span class="pulse" style="color:#34d399">keep-alive ON</span></p>
  <div class="sess"><i class="dot" id="dot"></i>
    <div class="sess-info"><div class="badge">CROMA SESSION</div><div class="cart-name" id="cart">Checking...</div></div>
    <button class="btn-sm" onclick="pingSession()">Refresh</button>
    <button class="btn-sm" onclick="location.href='/setup.html'">Setup</button>
  </div>
  <small style="display:block;margin-top:6px">Session khatam ho gaya? upar Setup kholo, bookmarklet se sync karo.</small>
</div>

<div class="card">
  <textarea id="codes" placeholder="WELCOME10&#10;SAVE500&#10;FIRSTORDER"></textarea>
  <div class="row">
    <button class="run" id="run">START</button>
    <button class="stop" id="stop" disabled>STOP</button>
    <button class="load" id="load">TXT<input type="file" id="file" accept=".txt,text/plain" hidden></button>
  </div>
  <div class="row">
    <label class="pill">Parallel <input type="number" id="conc" min="1" max="50" value="25"></label>
    <small>Beep: <input type="checkbox" id="beepOn" checked></small>
    <small style="margin-left:auto" id="cnt">0 codes</small>
  </div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between"><b id="statusLine" style="font-size:12px">Ready</b><b id="pct" style="font-size:12px">0%</b></div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="row" style="margin-top:6px">
    <button class="csv" id="csvAll">All CSV</button>
    <button class="csv g" id="csvValid">Valid CSV</button>
    <button class="csv y" id="csvNA">NA CSV</button>
  </div>
</div>

<div class="card"><b style="color:#6ee7b7;font-size:12px">VALID COUPONS (<span id="vCount">0</span>)</b>
  <div class="valid-list" id="validList" style="margin-top:8px">Yahan valid coupons dikhenge...</div></div>

<div class="card"><b style="font-size:12px">ALL RESULTS</b>
  <div style="max-height:320px;overflow:auto;margin-top:8px">
  <table><thead><tr><th>#</th><th>Coupon</th><th>Result</th><th>Dis.</th><th>Message</th></tr></thead><tbody id="tbody"></tbody></table></div></div>

<div class="card"><details><summary style="color:#94a3b8;font-size:11px;cursor:pointer">Log</summary>
<pre id="log" style="font:10px/1.5 monospace;color:#64748b;white-space:pre-wrap;margin-top:8px;max-height:150px;overflow:auto"></pre></details></div>

<script>
let jobId=null, jobDone=true, rowCount=0, allResults=[], audio;
const $=id=>document.getElementById(id);

/* ================= STEALTH KEEP-ALIVE ================= */
let lastActivity = Date.now();
let lastPing = 0;
const INACTIVITY_MS = 20000;
const PING_GAP = 20000;

['touchstart','touchmove','click','scroll','keydown','input'].forEach(ev=>{
  document.addEventListener(ev, ()=>{ lastActivity = Date.now(); }, {passive:true});
});
document.addEventListener('visibilitychange', ()=>{ lastActivity = Date.now(); });

function startKeepAlive(){
  setInterval(()=>{
    const now = Date.now();
    const idle = now - lastActivity > INACTIVITY_MS;
    if(idle && !jobDone && now - lastPing >= PING_GAP){
      fetch('/api/ping').catch(()=>{});
      lastPing = now;
    }
    if(!jobDone && document.hidden && now - lastPing >= PING_GAP){
      fetch('/api/ping').catch(()=>{});
      lastPing = now;
    }
    if(idle && document.hidden && now - lastPing >= PING_GAP){
      fetch('/api/ping').catch(()=>{});
      lastPing = now;
    }
  }, 5000);
}
/* ================= END STEALTH ================= */

function pingSession(){
  fetch('/api/session').then(r=>r.json()).then(j=>{
    $('dot').classList.toggle('live',!!j.live);
    $('cart').textContent = j.live ? (j.cart + (j.pincode?` | PIN ${j.pincode}`:'')) : 'Session nahi hai — Setup se sync karo';
  }).catch(()=>{ $('cart').textContent='Server connect nahi hua (pehli baar slow hota hai)'; $('dot').classList.remove('live'); });
}

function beep(){ if(!$('beepOn').checked)return; try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)();
  const o=audio.createOscillator(),g=audio.createGain(); o.type='sine';o.frequency.value=880;
  g.gain.setValueAtTime(.12,audio.currentTime); g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.1);
  o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.11);}catch{} }

function updCount(){ const n=[...new Set($('codes').value.split(/[\n,;\t]+/).map(c=>c.trim().toUpperCase()).filter(Boolean))].length; $('cnt').textContent=n+' codes'; }
$('codes').oninput=()=>{localStorage.setItem('cc_codes',$('codes').value);updCount()};
$('codes').value=localStorage.getItem('cc_codes')||'';
$('conc').value=localStorage.getItem('cc_conc')||25;
updCount();

$('load').onclick=()=>$('file').click();
$('file').onchange=async()=>{ const f=$('file').files[0]; if(!f)return;
  try{ $('codes').value=await f.text(); localStorage.setItem('cc_codes',$('codes').value); updCount(); }catch{} $('file').value=''; };

$('run').onclick=()=>{
  const codes=$('codes').value.trim();
  if(!codes){ $('statusLine').textContent='Pehle coupons paste / TXT load karo'; return; }
  $('tbody').innerHTML=''; rowCount=0; allResults=[]; $('validList').textContent=''; $('vCount').textContent='0';
  ['s-checked','s-valid','s-na','s-err'].forEach(i=>$(i).textContent='0');
  fetch('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({codes,concurrency:Number($('conc').value)||25})})
  .then(r=>r.json()).then(j=>{
    if(!j.ok){ $('statusLine').textContent=j.error; return; }
    jobId=j.jobId; jobDone=false; $('run').disabled=true; $('stop').disabled=false;
    localStorage.setItem('cc_conc',$('conc').value); poll();
  });
};
$('stop').onclick=()=>{ fetch('/api/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jobId})}); };

function addRow(i,r){ const tr=document.createElement('tr');
  tr.innerHTML=`<td>${i}</td><td>${r.code}</td><td class="${r.error?'err':r.valid?'ok':'na'}">${r.error?'ERROR':r.valid?'VALID':'NOT APPLICABLE'}</td><td>Rs. ${(r.discount||0)}</td><td>${(r.error||r.message||'').replace(/</g,'&lt;')}</td>`;
  $('tbody').appendChild(tr); }

function poll(){
  if(!jobId||jobDone) return;
  fetch(`/api/result?jobId=${jobId}&from=${rowCount}`)
  .then(r=>r.json()).then(j=>{
    if(!j.ok){ $('statusLine').textContent=j.error; return; }
    if(j.results){ j.results.forEach(r=>{ allResults.push(r); addRow(++rowCount,r); }); }
    $('s-checked').textContent=j.counts.checked; $('s-valid').textContent=j.counts.valid;
    $('s-na').textContent=j.counts.na; $('s-err').textContent=j.counts.errors;
    $('vCount').textContent=j.counts.valid;
    if(j.valid && j.valid.length) $('validList').textContent=j.valid.join('\n');
    if(j.newValidBeep) beep();
    $('log').textContent=(j.log||[]).join('\n');
    const p=Math.round(j.counts.checked/j.total*100)||0;
    $('barFill').style.width=p+'%'; $('pct').textContent=p+'%';
    if(j.status==='running'||j.status==='stopping'){ $('statusLine').textContent=`Checking... ${j.counts.checked}/${j.total}`; setTimeout(poll,1200); }
    else{ jobDone=true; $('run').disabled=false; $('stop').disabled=true;
      $('statusLine').textContent=`${j.status.toUpperCase()} — ${j.counts.valid} valid, ${j.counts.na} NA, ${j.counts.errors} errors`;
      if(j.error) $('statusLine').textContent+=' | '+j.error; }
  }).catch(()=>{ if(!jobDone) setTimeout(poll,3000); });
}

function dl(rows,name){
  if(!rows.length) return;
  const csv=[['Coupon','Result','Discount','Message'],...rows.map(r=>[r.code,r.error?'ERROR':r.valid?'VALID':'NOT APPLICABLE',r.discount||0,r.error||r.message||''])]
    .map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=name; a.click();
}
$('csvAll').onclick=()=>dl(allResults,'all_results.csv');
$('csvValid').onclick=()=>dl(allResults.filter(r=>r.valid),'valid_coupons.csv');
$('csvNA').onclick=()=>dl(allResults.filter(r=>!r.valid&&!r.error),'not_applicable.csv');

pingSession();
startKeepAlive();
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
